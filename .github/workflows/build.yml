name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        run: dotnet build installer -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Rename MSI
        shell: pwsh
        run: Move-Item installer/bin/Release/BrightnessBridge.msi "BrightnessBridge-${{ steps.version.outputs.version }}.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: BrightnessBridge-msi
          path: BrightnessBridge-*.msi

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "BrightnessBridge-${{ steps.version.outputs.version }}.msi" --title "BrightnessBridge ${{ github.ref_name }}" --generate-notes
